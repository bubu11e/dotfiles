"$schema" = 'https://starship.rs/config-schema.json'

# Every module listed here is evaluated on every prompt, and the language-detection
# modules do it by scanning the current directory. Keep the list to what is actually
# read: the previous eleven ($c $rust $nodejs $php $java $kotlin $haskell $python
# $conda ...) each paid a scan, and starship gives up with "Scanning current
# directory timed out" once they exceed scan_timeout on a large or networked dir.
# Anything configured below must also appear in this format string, or it is dead
# config that never renders.
#
# The powerline separators below live in this string, so they render whether or not
# the module that follows them does. The chain therefore covers only what is always
# present — os, directory, git — and ends at the yellow cap. Everything after it is
# conditional and carries its own caps, so a silent module leaves no trace; an
# always-rendered arrow into an empty block is what this layout exists to avoid.
# $container and $git_state are the exception: they share the background of the block
# they sit in, so they need no separator of their own.
format = """
[](red)\
$os\
$container\
$username\
$hostname\
[](bg:peach fg:red)\
$directory\
[](bg:yellow fg:peach)\
$git_branch\
$git_state\
$git_status\
[](fg:yellow)\
$golang\
${env_var.VIRTUAL_ENV_PROMPT}\
$jobs\
$terraform\
$kubernetes\
$docker_context\
$cmd_duration\
$status\
$character"""

palette = 'catppuccin_mocha'

[os]
disabled = false
style = "bg:red fg:crust"

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[container]
# Renders only inside a container (/run/.containerenv, /.dockerenv), so it costs
# nothing on the host. Shares the red background rather than opening a block of its
# own — see the note on the format string.
style = "bg:red fg:crust"
format = '[ ⬢ $name]($style)'

[username]
show_always = true
style_user = "bg:red fg:crust"
style_root = "bg:red fg:crust"
format = '[ $user]($style)'

[hostname]
# ssh_only (the default) keeps this silent on the local machine, where the host name
# is a constant, and shows it in the same red block once the shell is on a remote
# box — the case where confusing two terminals actually costs something.
ssh_only = true
ssh_symbol = "󰢹 "
style = "bg:red fg:crust"
format = '[@$ssh_symbol$hostname]($style)'

[directory]
style = "bg:peach fg:crust"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:yellow"
# $remote_name is worth the width because a branch can track a remote that is not
# origin, and this machine pushes some repos to a mirror as well as their origin.
format = '[[ $symbol $branch(:$remote_name/$remote_branch) ](fg:crust bg:yellow)]($style)'
always_show_remote = true

[git_state]
# Silent outside a git operation. The point is the case where `git status` would have
# told you a rebase is half-finished and the branch name alone does not.
style = "bg:yellow"
format = '[[($state( $progress_current/$progress_total) )](fg:crust bg:yellow)]($style)'

[git_status]
style = "bg:yellow"
format = '[[($all_status$ahead_behind )](fg:crust bg:yellow)]($style)'

[golang]
symbol = ""
style = "bg:green"
format = '[](fg:green)[ $symbol( $version) ](fg:crust bg:green)[](fg:green)'

[env_var.VIRTUAL_ENV_PROMPT]
# Replaces the built-in $python module. That module scans the working directory on
# every prompt just to decide whether to render; venv already exports
# VIRTUAL_ENV_PROMPT (e.g. "(myenv) "), so reading it costs nothing and still shows
# the part that mattered here — which environment is active.
style = "bg:green"
format = '[](fg:green)[ $env_value](fg:crust bg:green)[](fg:green)'

[jobs]
# Shell state, not a directory scan, so it is free.
symbol = "✦"
number_threshold = 1
format = '[](fg:green)[ $symbol$number ](fg:crust bg:green)[](fg:green)'
style = "bg:green"

[terraform]
# $version forks the terraform binary on every prompt in a .tf directory; $workspace
# alone would just read .terraform/environment. The version is here deliberately —
# measure before removing it.
symbol = "山"
style = "bg:mauve"
format = '[](fg:mauve)[ $symbol $workspace( $version) ](fg:crust bg:mauve)[](fg:mauve)'

[kubernetes]
# Scoped to directories that actually hold manifests, so the kubeconfig is not parsed
# on every prompt everywhere. Wrong-cluster is the failure this exists to catch.
disabled = false
symbol = "⎈ "
style = "bg:sky"
detect_files = ['Chart.yaml', 'kustomization.yaml', 'skaffold.yaml']
detect_folders = ['k8s', 'manifests', 'kubernetes']
format = '[](fg:sky)[ $symbol$context( :$namespace) ](fg:crust bg:sky)[](fg:sky)'

[docker_context]
# only_with_files = false because DOCKER_HOST is exported globally from ~/.shell.env:
# the dangerous case is running docker from a directory with no Dockerfile in it and
# forgetting the daemon is on another machine. Silent when the context is default.
only_with_files = false
symbol = " "
style = "bg:blue"
format = '[](fg:blue)[ $symbol$context ](fg:crust bg:blue)[](fg:blue)'

[cmd_duration]
show_milliseconds = false
format = '[](fg:lavender)[ in $duration ](fg:crust bg:lavender)[](fg:lavender)'
style = "bg:lavender"
disabled = false
show_notifications = true
min_time_to_notify = 45000

[status]
# The red character already says a command failed; this says which kind. 127, 130 and
# 1 are three different mistakes and they used to look identical.
disabled = false
recognize_signal_code = true
symbol = ""
style = "bg:red"
format = '[](fg:red)[ $common_meaning$signal_name$maybe_int ](fg:crust bg:red)[](fg:red)'

[character]
disabled = false
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
